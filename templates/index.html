<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF to Excel Extractor</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
      }
      .card {
        width: min(480px, 92vw);
        background: #fff;
        color: #111;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      .hint {
        color: #555;
        font-size: 0.95rem;
      }
      .flash {
        border-radius: 8px;
        margin: 12px 0;
        padding: 10px;
      }
      .flash.error {
        background: #ffe9e9;
        color: #8d1e1e;
      }
      button {
        margin-top: 14px;
        background: #2663eb;
        border: 0;
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PDF to Excel</h1>
      <p class="hint">Upload a PDF and download an Excel file with extracted tables and text.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="post" action="/convert" enctype="multipart/form-data">
        <input type="file" name="pdf_file" accept="application/pdf,.pdf" required />
        <br />
        <button type="submit">Convert to Excel</button>
      </form>
    </main>
  </body>
</html>
